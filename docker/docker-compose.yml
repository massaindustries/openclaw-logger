version: "3.9"
services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./../backend/.env
    environment:
      - SESSIONS_DIR=/app/sessions
    volumes:
      - ../sessions:/app/sessions
    restart: unless-stopped
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend
